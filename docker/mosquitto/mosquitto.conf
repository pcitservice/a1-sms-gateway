# =============================================================================
# PCIT SMS Gateway — Mosquitto broker configuration
# =============================================================================

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type warning
log_type error
log_type notice

# ---- Global auth (applies to all listeners in Mosquitto 2.0) ----
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file      /mosquitto/config/aclfile

# ---- Plain MQTT on 1883 (loopback only, for api + listener containers) ----
listener 1883
protocol mqtt

# ---- Public MQTTS on 8883 is added later once TLS certs are mounted ----
# When sms.pcitservice.dk is provisioned in CyberPanel, bind-mount
# /etc/letsencrypt/live/sms.pcitservice.dk into the mosquitto container and
# uncomment the block below:
#
# listener 8883
# protocol mqtt
# cafile   /etc/letsencrypt/live/sms.pcitservice.dk/chain.pem
# certfile /etc/letsencrypt/live/sms.pcitservice.dk/fullchain.pem
# keyfile  /etc/letsencrypt/live/sms.pcitservice.dk/privkey.pem

# ---- Limits ----
max_connections   5000
max_inflight_messages 40
max_queued_messages   1000
retry_interval    5
message_size_limit 4096

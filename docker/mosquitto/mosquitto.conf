# =============================================================================
# PCIT SMS Gateway — Mosquitto broker configuration (2.0)
# =============================================================================

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error
log_type notice

# ---- Global auth (applies to all listeners in Mosquitto 2.0) ----
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file      /mosquitto/config/aclfile

# ---- Plain MQTT on 1883 (loopback only, for api + listener containers) ----
listener 1883
protocol mqtt

# ---- Public MQTTS on 8883 with Let's Encrypt cert for sms.a1techflow.com ----
# The certificate lives on the host under /etc/letsencrypt/live/sms.a1techflow.com/
# and is bind-mounted read-only into this container at /etc/letsencrypt/live/…
# (see docker-compose.yml). No client certs are required — password auth
# is still enforced by the global password_file above.
listener 8883
protocol mqtt
cafile   /etc/letsencrypt/live/sms.a1techflow.com/chain.pem
certfile /etc/letsencrypt/live/sms.a1techflow.com/fullchain.pem
keyfile  /etc/letsencrypt/live/sms.a1techflow.com/privkey.pem
tls_version tlsv1.2

# ---- Limits ----
max_connections        5000
max_inflight_messages    40
max_queued_messages    1000
max_packet_size        4096

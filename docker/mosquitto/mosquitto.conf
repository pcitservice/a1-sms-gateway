# =============================================================================
# A1 SMS Gateway — Mosquitto broker configuration
# =============================================================================

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type warning
log_type error
log_type notice

# ---- Plain MQTT on 1883 (loopback only, for api + listener containers) ----
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# ---- MQTTS on 8883 (public — for internet-facing TRB140 devices) ----
# Certificates are populated by the installer / TLS renewal; if missing at
# boot, mosquitto will still start (the plain listener above still works).
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
# Uncomment and mount CyberPanel's cert when ready for production TLS:
# cafile   /etc/letsencrypt/live/sms.a1techflow.com/chain.pem
# certfile /etc/letsencrypt/live/sms.a1techflow.com/fullchain.pem
# keyfile  /etc/letsencrypt/live/sms.a1techflow.com/privkey.pem

# ---- ACL — devices can only touch their own topics ----
acl_file /mosquitto/config/aclfile

# ---- Limits ----
max_connections   5000
max_inflight_messages 40
max_queued_messages   1000
retry_interval    5
message_size_limit 4096

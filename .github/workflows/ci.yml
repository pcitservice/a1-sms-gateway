name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: a1sms
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: a1sms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U a1sms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pdo_pgsql, redis
          coverage: none
          tools: composer:v2
      - name: Install
        working-directory: api
        run: |
          # bootstrap/cache and storage/framework/* are gitignored; recreate.
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/{cache,sessions,testing,views}
          mkdir -p storage/logs
          # .env must exist BEFORE composer's post-autoload-dump script fires,
          # or artisan package:discover fails on a fresh checkout.
          cp .env.example .env
          composer install --prefer-dist --no-progress --no-interaction --no-scripts
          php artisan key:generate
          composer dump-autoload -o
          php artisan package:discover --ansi
      - name: Test
        working-directory: api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: a1sms
          DB_PASSWORD: secret
          DB_DATABASE: a1sms_test
          REDIS_HOST: 127.0.0.1
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: ./vendor/bin/pest --colors=always

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: web
        env:
          # Skip build-time API round-trips; we only lint + build for type check.
          NEXT_PUBLIC_API_BASE: /api/v1
          NEXT_PUBLIC_APP_NAME: 'A1TechFlow SMS'
        run: |
          # `npm ci` needs a lockfile; the web folder is gitignored past
          # node_modules but the lockfile isn't checked in yet — install
          # fresh. --legacy-peer-deps lets react@19.0.0 coexist with
          # next@15.0.0 (which advertises a react rc as its peer).
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run lint --if-present
          npm run build
